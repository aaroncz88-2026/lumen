<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>引光 LUMEN</title>
<meta name="description" content="转动光路，让每一盏花灯醒来。一款安静的手绘风解谜小游戏。">
<meta name="theme-color" content="#2f6f8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="引光">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="引光 LUMEN">
<meta property="og:description" content="转动光路，让每一盏花灯醒来。">
<meta property="og:image" content="assets/cover-l.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body data-mode="cover">

<!-- 图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.6" cy="18" r="2.4"/><circle cx="16.6" cy="16" r="2.4"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5L4 9l4 4"/><path d="M4 9h9.5a5.5 5.5 0 0 1 0 11H10"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M11 3l2 5.6 5.6 2-5.6 2-2 5.6-2-5.6-5.6-2 5.6-2z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.7-6"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2.5"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></symbol>
  </defs>
</svg>

<!-- 背景插画（两层交叉淡入） -->
<div id="bg"><div class="bgl b-cover on"></div><div class="bgl"></div></div>
<canvas id="c"></canvas>

<!-- 封面 -->
<section id="cover" class="screen">
  <button id="btnMuteC" class="ib corner" aria-label="声音"><svg><use href="#i-note"/></svg></button>
  <div class="brand">
    <img class="logo" src="assets/logo.png" alt="引光" draggable="false">
    <div class="en">LUMEN</div>
    <p class="tagline">转动光路，让每一盏花灯醒来</p>
  </div>
  <div class="actions">
    <button id="btnPlay" class="btn primary">开始旅程</button>
    <div class="row">
      <button id="btnLevels" class="btn">旅途</button>
      <button id="btnEndless" class="btn">无尽花园</button>
    </div>
    <p class="how">左键转动 · 右键反转 · Shift+点击 别上叶子</p>
  </div>
</section>

<!-- 选关 -->
<section id="select" class="screen hidden">
  <header class="bar">
    <button id="btnSelBack" class="ib" aria-label="返回"><svg><use href="#i-back"/></svg></button>
    <h2>旅途</h2>
    <div class="total">★ <b id="starTotal">0</b><i>/60</i></div>
  </header>
  <div id="chapters"></div>
</section>

<!-- 游戏内 -->
<div id="hud" class="hidden">
  <div id="hudTop">
    <div class="line">
      <button id="btnBack" class="ib" aria-label="返回"><svg><use href="#i-back"/></svg></button>
      <div class="ttl"><span id="lvCh">第一章 · 晨雾</span><b id="lvName">1 · 初芽</b></div>
      <button id="btnMute" class="ib" aria-label="声音"><svg><use href="#i-note"/></svg></button>
    </div>
    <div class="chips">
      <span class="chip">花灯 <b id="lamps">0</b><i id="lampsAll">/0</i></span>
      <span class="chip">步数 <b id="moves">0</b></span>
    </div>
  </div>
  <div id="hudBottom">
    <p id="tip"></p>
    <div class="tools">
      <button id="btnUndo" class="tb"><svg><use href="#i-undo"/></svg><span>撤销</span></button>
      <button id="btnHint" class="tb"><svg><use href="#i-hint"/></svg><span>提示</span></button>
      <button id="btnReset" class="tb"><svg><use href="#i-reset"/></svg><span>重来</span></button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<!-- 通关 -->
<section id="win" class="screen hidden">
  <div class="panel">
    <span class="cap" id="winCap">第 1 关 · 初芽</span>
    <h3 id="winTitle">花灯盛开</h3>
    <div id="stars"><i>★</i><i>★</i><i>★</i></div>
    <div class="res">
      <div><span>步数</span><b id="rMoves">0</b></div>
      <div><span>最少</span><b id="rPar">0</b></div>
      <div><span>用时</span><b id="rTime">0:00</b></div>
    </div>
    <p id="rNote"></p>
    <p id="rUnlock"></p>
    <button id="btnNext" class="btn primary">下一关</button>
    <div class="row">
      <button id="btnRetry" class="btn sm">再玩一次</button>
      <button id="btnMenu" class="btn sm">旅途</button>
    </div>
  </div>
</section>

<!-- 手机横屏时的提醒 -->
<div id="turn"><div><b>把手机竖过来玩吧</b><span>竖屏下花园更大，也更好点</span></div></div>

<script src="core.js?v=2"></script>
<script src="game.js?v=2"></script>
</body>
</html>
